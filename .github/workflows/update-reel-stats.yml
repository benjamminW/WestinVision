name: Update reel stats

# Once a day, refresh the views and likes on each reel in projects.js from the
# public pages, then redeploy the site if any number changed.
on:
  schedule:
    - cron: "17 11 * * *" # daily, around 5-6 AM Central
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: reel-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Refresh reel numbers
        run: node .github/scripts/update-reel-stats.mjs

      - name: Save and redeploy if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- projects.js; then
            echo "No changes to reel stats."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects.js
          git commit -m "Update reel views and likes"
          git pull --rebase origin main
          git push origin HEAD:main
          # Pushes made by this workflow do not trigger other workflows, so start the deploy directly.
          gh workflow run pages.yml --ref main
